name: Refresh Package Reach

on:
  schedule:
    - cron: "41 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-reach-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install metric dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite", "packageRank"))

      - name: Build validated package snapshot
        run: |
          Rscript cloudflare/gallery-analytics-worker/scripts/build-package-reach.R \
            "$RUNNER_TEMP/package-reach.json"

      - name: Publish snapshot
        env:
          PACKAGE_REACH_INGEST_TOKEN: ${{ secrets.PACKAGE_REACH_INGEST_TOKEN }}
        run: |
          endpoint="https://gallery-analytics.gallery-analytics-worker.workers.dev/v1/package-reach"
          curl --fail-with-body --retry 3 --request PUT \
            --header "Authorization: Bearer ${PACKAGE_REACH_INGEST_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/package-reach.json" \
            "$endpoint"
          curl --fail-with-body --retry 3 "$endpoint" \
            | jq -e '.schemaVersion == 1 and .status == "current" and (.packages | length == 3)'
