name: Prebuilt Site Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  prebuilt-site:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify prebuilt Pages artifacts
        run: |
          test -f docs/index.html
          test -f docs/search.json
          test -f docs/sitemap.xml
          test -f .nojekyll
          test -f docs/gallery_usage.html
          test -f docs/www/js/gallery-usage.js

      - name: Test analytics Worker
        run: |
          node --check cloudflare/gallery-analytics-worker/src/index.js
          node --check cloudflare/gallery-analytics-worker/src/schema.js
          node --check cloudflare/gallery-analytics-worker/src/package-reach-schema.js
          node --test cloudflare/gallery-analytics-worker/test/worker.test.js
          Rscript -e 'parse(file = "cloudflare/gallery-analytics-worker/scripts/build-package-reach.R")'
